<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>StickBlade</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    @font-face {
      font-family: 'Cinzel';
      src: url('/font/Cinzel/Cinzel-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cinzel', serif; }
    * {
      scrollbar-width: thin;
      scrollbar-color: #d4a84b transparent;
    }
    *::-webkit-scrollbar {
      width: 12px;
      height: 12px;
      background: transparent;
    }
    *::-webkit-scrollbar-track {
      background: transparent;
    }
    *::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #f2d87a 0%, #d4a84b 48%, #8e6420 100%);
      border: 3px solid transparent;
      border-radius: 999px;
      background-clip: content-box;
    }
    *::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #fff0a8 0%, #e0b957 48%, #a87a28 100%);
      border: 3px solid transparent;
      border-radius: 999px;
      background-clip: content-box;
    }
    *::-webkit-scrollbar-corner {
      background: transparent;
    }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; touch-action: none; }
    canvas { display: block; touch-action: none; }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #ui-root { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #ui-root > * { pointer-events: all; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="ui-root">
    <div id="startup-loading-overlay" style="position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;background:#050403;color:#d4a84b;font-family:'Cinzel',serif;letter-spacing:0.12em;transition:opacity 0.3s ease-out;user-select:none;">
      <div style="position:relative;display:flex;align-items:center;justify-content:center;max-width:min(90vw, 840px);max-height:55vh;">
        <img id="startup-loading-banner" src="/SPRITES/GameLoadingBanner/StickBlade_Banner.png" alt="StickBlade" style="max-width:100%;max-height:55vh;width:auto;height:auto;object-fit:contain;display:block;filter:drop-shadow(0 0 24px rgba(212,168,75,0.25));border-radius:4px;" />
      </div>
      <div id="startup-loading-status" style="display:none;font-size:0.9rem;color:rgba(212,168,75,0.8);text-transform:uppercase;"></div>
      <div id="startup-loading-track" style="width:min(480px,75vw);height:4px;background:rgba(212,168,75,0.15);overflow:hidden;border-radius:2px;">
        <div id="startup-loading-fill" style="height:100%;width:0;background:#d4a84b;transition:width 0.1s linear;box-shadow:0 0 16px rgba(212,168,75,0.7);"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
